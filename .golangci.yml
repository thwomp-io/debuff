version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - staticcheck
    - unused
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/thwomp-io/debuff
