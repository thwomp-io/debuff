name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet · test · build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: scripts/build.sh
      - name: Smoke
        run: |
          dist/debuff version
          dir=$(mktemp -d)
          dist/debuff serve --demo --addr 127.0.0.1:8737 --state-dir "$dir" &
          sleep 2
          dist/debuff health
